# PLEASE NOTE THIS FILE IS NOT USED AUTOMATICALLY BY THE ODOMETRY'S LAUNCH FILE
# it's meant to just tell you what are the defaults for all the parameters
# to use this config with the launch file, you will still have to pass it with
# `config_file:=<full_or_relative_path_to>/ros_default.yaml`
# #############################################################################
base_frame: base_link
imu_topic: /sensing/ins/imu
imu_frame: imu
lidar_topic: /sensing/pandar
lidar_frame: pandar
# extrinsic_lidar2base_quat_xyzw_xyz: [qxyzw_xyz as a list, unnecessary if tf is well defined]
# extrinsic_imu2base_quat_xyzw_xyz: [qxyzw_xyz as a list, unnecessary if tf is well defined]
odom_topic: /rko_lio/odom
odom_frame: odom
invert_odom_tf: false
publish_local_map: false
map_topic: /rko_lio/local_map
publish_deskewed_scan: false
odom_at_imu_rate: false
# TwistWithCovarianceStamped output (for EKF integration)
# set publish_twist_stamped: true to enable /rko_lio/twist
publish_twist_stamped: false
twist_topic: /rko_lio/twist
twist_linear_covariance: 0.1   # m/s variance; tune relative to NDT / GNSS covariance
twist_angular_covariance: 0.01  # rad/s variance
# IMU-rate seq pipeline (used when launched with odom_at_imu_rate:=true and mode:=online):
# seq:
#   odom_at_imu_rate_topic: rko_lio/odom_at_imu_rate
#   tf_at_imu_rate: false

# lio config
deskew: true
voxel_size: 1.0
max_points_per_voxel: 20
max_range: 100.0
min_range: 1.0
max_correspondence_distance: 0.5
convergence_criterion: 0.00001
max_num_threads: 0
initialization_phase: false
double_downsample: true
max_expected_jerk: 3.0
min_beta: 200.0
# Lidar per-point timestamp processing - set when the heuristic fails.
# In ROS1, these are loaded as nested YAML which maps to parameter names
# like "lidar_timestamps/multiplier_to_seconds" via rosparam.
# lidar_timestamps:
#   multiplier_to_seconds: 0.0   # 0.0 = autodetect; e.g. 1e-6 for microseconds
#   force_absolute: false
#   force_relative: false
